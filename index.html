var lqc=-1,lq=null,la=[],vqc=-1,vq=null,va=[],qs=null,pl=0;
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function opts(ok,pool){var o=shuf(pool.filter(function(x){return x!=ok})).slice(0,2);o.push(ok);o=shuf(o);return{o:o,a:o.indexOf(ok)}}
function pool(k,f){var r=[];L.forEach(function(l,i){if(i!=c)l[f].forEach(function(x){r.push(x.split("|")[k])})});return r}
function cnt(a){var n=0;for(var i=0;i<a.length;i++)if(a[i]!=null)n++;return n}
function rq0(){lqc=-1;vqc=-1;qs=null;la=[];va=[]}

function mkV(){if(vqc==c&&vq)return;vqc=c;va=[];qs=null;vq=shuf(L[c].w).map(function(x){var p=x.split("|"),z=opts(p[2],pool(2,"w"));return{h:p[0],o:z.o,a:z.a}})}
function score(a,q){var ok=0;q.forEach(function(x,i){if(a[i]==x.a)ok++});return Math.round(100*ok/q.length)}
function pickA(i,j){if(la[i]!=null)return;la[i]=j;if(cnt(la)==lq.length)ls=score(la,lq);render()}

lq.forEach(function(q,i){h+='<div class="card"><h3 style="margin-top:0">'+(i+1)+'. '+esc(q.t)+'</h3>'+(q.k=="d"?'<button class="pri" onclick="playD()">▶ Nghe hội thoại</button>':'<button class="pri" onclick="say(\''+q.z+'\')">▶ Nghe câu</button>')+btns(q,la[i],'pickA('+i)+'</div>'});
if(ls!==null)h+='<div class="msg">Điểm nghe hiểu: <b>'+ls+'/100</b></div><h3>Nội dung hội thoại</h3>'+L[c].d.map(function(x){var p=x.split("|");return '<div class="card"><div class="hz">'+p[0]+'</div><div class="py">'+tn(p[1])+'</div><div class="vi">'+p[2]+'</div></div>'}).join("")+'<p><button class="pri" onclick="go(\'speak\')">Sang phần Nói</button></p>';
return h+'<h3>Nghe liên tục, đọc theo</h3><p class="sub">Máy đọc từng từ và câu, dừng 3 giây để bạn đọc theo, rồi đọc lại. Hợp khi người khác lái xe. Một số máy tự dừng khi tắt màn hình.</p><button class="'+(pl?'':'pri')+'" onclick="auto()">'+(pl?'Dừng':'▶ Bắt đầu')+'</button>'}
function quiz(){mkV();var h=head()+'<h2>Kiểm tra từ vựng</h2><p class="sub">Chọn nghĩa đúng của từ. Mỗi câu chỉ tính lần chọn đầu tiên.</p>';
vq.forEach(function(q,i){h+='<div class="card"><div class="row"><button class="sp" aria-label="Nghe" onclick="say(\''+q.h+'\')">▶</button><div class="hz">'+q.h+'</div></div>'+btns(q,va[i],'pickV('+i)+'</div>'});
if(qs!==null)h+='<div class="msg">Điểm từ vựng: <b>'+qs+'/100</b></div><button class="pri" style="width:100%" onclick="fin()">Hoàn thành bài hôm nay</button>'+(msg?'<div class="msg">'+msg+'</div>':'');return h}
function playD(){var d=L[c].d;say(d[0].split("|")[0],function(){say(d[1].split("|")[0])})}
function stopA(){pl=0;try{speechSynthesis.cancel()}catch(e){}render()}
function auto(){if(pl){stopA();return}var tk=pl=Date.now(),it=L[c].w.concat(L[c].s).map(function(x){return x.split("|")[0]}),i=0;
(function nx(){if(pl!==tk)return;if(i>=it.length){pl=0;render();return}var z=it[i++];say(z,function(){if(pl!==tk)return;setTimeout(function(){if(pl!==tk)return;say(z,function(){setTimeout(nx,1200)})},3000)})})();render()}
function sim(a,b){var f=function(s){return s.replace(/[^\u4e00-\u9fffA-Za-z]/g,"").toLowerCase()};a=f(a);b=f(b);if(!a.length)return 0;var m=[],i,j;for(i=0;i<=a.length;i++){m[i]=[];for(j=0;j<=b.length;j++)m[i][j]=0}
for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=a[i-1]==b[j-1]?m[i-1][j-1]+1:Math.max(m[i-1][j],m[i][j-1]);return Math.round(100*m[a.length][b.length]/a.length)}
function selfb(i){return 'Tự đánh giá phát âm (không tính vào điểm): <button onclick="selfrate('+i+',1)">Tự tin</button> <button onclick="selfrate('+i+',0)">Cần luyện thêm</button>'}
function selfrate(i,v){sr[i]=v;document.getElementById("r"+i).textContent="Đã ghi nhận tự đánh giá: "+(v?"tự tin":"cần luyện thêm")+"."}
function rec(i){var R=window.SpeechRecognition||window.webkitSpeechRecognition,el=document.getElementById("r"+i);
if(!R){el.innerHTML="Trình duyệt này chưa hỗ trợ ghi âm. "+selfb(i);return}
var r=new R();r.lang="zh-CN";el.textContent="Đang nghe, hãy nói…";
r.onresult=function(e){var h=e.results[0][0].transcript,sc=sim(L[c].s[i].split("|")[0],h);ss[i]=sc;el.innerHTML="Máy nghe được: <b>"+esc(h)+"</b><br>Khớp văn bản: "+sc+"/100. Đây là so khớp chữ, không phải chấm phát âm."+(sc>=80?" Rất khớp!":" Hãy nghe lại mẫu và chú ý thanh điệu.")};

function speak(){var l=L[c];return head()+'<h2>Luyện nói</h2><p class="sub">Nghe mẫu, rồi bấm Nói và đọc lại câu. Điểm chỉ so khớp chữ máy nghe được với câu mẫu, không đánh giá phát âm.</p>'+l.s.map(function(x,i){var p=x.split("|");return '<div class="card"><div class="hz">'+p[0]+'</div><div class="py">'+tn(p[1])+'</div><p style="margin:8px 0"><button onclick="say(\''+p[0]+'\')">▶ Mẫu</button> <button class="pri" onclick="rec('+i+')">🎤 Nói</button></p><div class="vi" id="r'+i+'" aria-live="polite">'+(ss[i]!=null?"Khớp văn bản: "+ss[i]+"/100":sr[i]!=null?"Tự đánh giá: "+(sr[i]?"tự tin":"cần luyện thêm"):"")+'</div></div>'}).join("")+'<button class="pri" onclick="fin()">Hoàn thành bài hôm nay</button>'+(msg?'<div class="msg">'+msg+'</div>':'')}
function fin(){var L0=L[c],n3=0,k=Object.keys(ss).map(function(x){return ss[x]});for(var i=0;i<L0.s.length;i++)if(ss[i]!=null||sr[i]!=null)n3++;
if(ls===null||qs===null||n3<L0.s.length){msg="Hãy làm xong phần Nghe, Kiểm tra và luyện cả "+L0.s.length+" câu ở phần Nói (bằng micro hoặc tự đánh giá).";render();return}
var sp=k.length?Math.round(k.reduce(function(a,b){return a+b},0)/k.length):null,pt=sp===null?[ls,qs]:[ls,qs,sp],sc=Math.round(pt.reduce(function(a,b){return a+b},0)/pt.length),n=c+1,e={d:new Date().toISOString().slice(0,10),n:n,sc:sc,l:ls,q:qs,s:sp},j=-1;
S.log.forEach(function(x,q){if(x.n==n)j=q});if(j>=0)S.log[j]=e;else S.log.push(e);
if(S.done.indexOf(c)<0){S.done.push(c);L0.w.concat(L0.s).forEach(function(x){var h=x.split("|")[0];if(!S.cards[h])S.cards[h]={b:0,d:day()+1}})}
var ok=sv();
msg="Điểm hôm nay: <b>"+sc+"/100</b> (Nghe "+ls+"; từ vựng "+qs+(sp===null?"; Nói: tự đánh giá nên không tính điểm":"; khớp văn bản khi nói "+sp)+"). "+(sc<60?"Bài sau sẽ đơn giản hơn và ôn lại từ cơ bản.":sc<80?"Giữ nguyên mức này, thêm bài tập thực hành.":sc<90?"Bài sau tăng độ khó phần nghe.":"Rất tốt! Bài sau sẽ khó hơn.")+(S.done.length<L.length?" Bài tiếp theo: Bài "+(nextL()+1)+".":" Bạn đã xong cả "+L.length+" bài hiện có. Hãy gửi Bản ghi tiến độ cho Claude để tạo thêm bài.")+(ok?"":" Chưa lưu được tiến độ, hãy dùng Sao lưu.");
c=nextL();ls=null;lp=false;ss={};sr={};rq0();render()}
function buildQ(){var t=day();rq=Object.keys(S.cards).filter(function(h){return S.cards[h].d<=t}).sort(function(x,y){return S.cards[x].b-S.cards[y].b}).slice(0,15);shown=false}
function review(){if(!Object.keys(S.cards).length)return '<h1>Ôn tập</h1><p class="sub">Chưa có từ để ôn. Hoàn thành một bài để bắt đầu. Lịch ôn: sau 1, 3, 7, 14, 30 ngày.</p>';

return "Factory Mandarin | Bài đã xong: "+S.done.length+"/"+L.length+" | Từ đã thuộc: "+m+" | Từ cần ôn: "+(w.length?w.map(function(h){return h+" "+D[h].py}).join(", "):"không")+" | Điểm TB: "+a("sc")+" (Nghe "+a("l")+", từ vựng "+a("q")+", khớp văn bản khi nói "+a("s")+") | Điểm gần nhất: "+(n?S.log[n-1].sc:"chưa có")}

'<h3>Từ cần ôn thêm</h3><p>'+(w.length?w.map(function(h){return '<span class="hz" style="font-size:1.2rem">'+h+'</span> <span class="vi">'+D[h].vi+'</span>'}).join(" &nbsp; "):'Chưa có.')+'</p><h3>Điểm các ngày</h3>'+(n?S.log.slice(-7).map(function(x){return '<div class="card">'+x.d+': Bài '+x.n+' – <b>'+x.sc+'</b> (Nghe '+x.l+', '+(x.s==null?'Nói: tự đánh giá':'khớp văn bản '+x.s)+')</div>'}).join(""):'<p class="sub">Chưa có.</p>')+
'<h3>Bản ghi tiến độ cho Claude</h3><textarea id="rec" readonly>'+rec2()+'</textarea><p><button class="pri" onclick="cp()">Sao chép bản ghi</button></p><div id="cpm" class="vi"></div><p class="sub">Dán bản ghi vào chat với Claude để tạo bài mới và ôn đúng chỗ yếu. Dữ liệu lưu trong trình duyệt này.</p><h3>Sao lưu và khôi phục</h3><p><button onclick="bk()">Tạo bản sao lưu</button></p><textarea id="bkt" placeholder="Dán bản sao lưu vào đây để khôi phục"></textarea><p><button onclick="rs()">Khôi phục từ nội dung đã dán</button></p><div id="bkm" class="vi"></div>'}
