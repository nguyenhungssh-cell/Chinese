function row(x){var p=x.split("|");return '<div class="card row"><button class="sp" aria-label="Nghe" onclick="say(\''+p[0]+'\')">▶</button><div><div class="hz">'+p[0]+'</div><div class="py">'+tn(p[1])+'</div><div class="vi">'+p[2]+'</div></div></div>'}
function nav(){var T=[["learn","Học"],["listen","Nghe"],["speak","Nói"],["review","Ôn tập"],["prog","Tiến độ"]];
document.getElementById("nav").innerHTML=T.map(function(t){return '<button onclick="go(\''+t[0]+'\')"'+(tab==t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>'}).join("")}
function go(t){tab=t;msg="";if(t=="review"){buildQ()}render();window.scrollTo(0,0)}
function pick(){c=+document.getElementById("sel").value;ls=null;lp=false;ss={};render()}
function head(){var o="";for(var i=0;i<L.length&&i<=S.done.length;i++)o+='<option value="'+i+'"'+(i==c?' selected':'')+'>Bài '+(i+1)+': '+L[i].t+'</option>';
return '<h1>Tiếng Trung cho IT Helpdesk</h1><p class="sub">Ngày '+(S.done.length+1)+' / 90. Mỗi ngày khoảng 15 phút.</p><select id="sel" onchange="pick()" aria-label="Chọn bài">'+o+'</select>'}
function learn(){var l=L[c];return head()+'<h2>'+l.t+'</h2><h3>Từ mới</h3>'+l.w.map(row).join("")+'<h3>Câu hay dùng</h3>'+l.s.map(row).join("")+'<p class="sub">Bấm ▶ để nghe. Nghe và đọc to theo 2–3 lần. Màu chữ Pinyin cho biết thanh điệu: xanh dương thanh 1, xanh lá thanh 2, vàng thanh 3, đỏ thanh 4.</p><button class="pri" onclick="go(\'listen\')">Sang phần Nghe</button>'}
function listen(){var l=L[c],q=l.q,o="";
if(lp){o=q[1].map(function(x,i){var k=ls!==null?(i==q[2]?" ok":""):"";return '<button class="opt'+k+'" onclick="ans('+i+')">'+x+'</button>'}).join("")}
var rev=ls!==null?'<h3>Nội dung hội thoại</h3>'+l.d.map(function(x){var p=x.split("|");return '<div class="card"><div class="hz">'+p[0]+'</div><div class="py">'+tn(p[1])+'</div><div class="vi">'+p[2]+'</div></div>'}).join(""):"";
return head()+'<h2>Nghe hội thoại</h2><p class="sub">Chưa có bản dịch. Nghe 1–2 lần rồi trả lời.</p><button class="pri" onclick="play()">▶ Nghe hội thoại</button>'+(lp?'<h3>'+q[0]+'</h3>'+o:'')+(ls!==null?'<div class="msg">'+(ls==100?'Đúng rồi! 100 điểm.':'Chưa đúng. 40 điểm, nghe lại nhé.')+'</div>':'')+rev+(ls!==null?'<p><button class="pri" onclick="go(\'speak\')">Sang phần Nói</button></p>':'')}
function play(){var d=L[c].d;lp=true;say(d[0].split("|")[0],function(){say(d[1].split("|")[0])});render()}
function ans(i){if(ls!==null)return;ls=i==L[c].q[2]?100:40;render()}
function sim(a,b){var f=function(s){return s.replace(/[^\u4e00-\u9fffA-Za-z]/g,"").toLowerCase()};a=f(a);b=f(b);if(!a.length)return 0;var m=[],i,j;for(i=0;i<=a.length;i++){m[i]=[];for(j=0;j<=b.length;j++)m[i][j]=0}
for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=a[i-1]==b[j-1]?m[i-1][j-1]+1:Math.max(m[i-1][j],m[i][j-1]);return Math.round(100*m[a.length][b.length]/a.length)}
function selfb(i){return 'Tự chấm: <button onclick="selfrate('+i+',90)">Tốt</button> <button onclick="selfrate('+i+',50)">Chưa tốt</button>'}
function selfrate(i,v){ss[i]=v;document.getElementById("r"+i).textContent="Đã ghi nhận: "+v+" điểm."}
function rec(i){var R=window.SpeechRecognition||window.webkitSpeechRecognition,el=document.getElementById("r"+i);
if(!R){el.innerHTML="Trình duyệt chưa hỗ trợ ghi âm. "+selfb(i);return}
var r=new R();r.lang="zh-CN";el.textContent="Đang nghe, hãy nói…";
r.onresult=function(e){var h=e.results[0][0].transcript,sc=sim(L[c].s[i].split("|")[0],h);ss[i]=sc;el.innerHTML="Máy nghe được: <b>"+h+"</b>. Điểm: "+sc+(sc>=80?". Tốt lắm!":". Nghe lại mẫu và chú ý thanh điệu.")};
r.onerror=function(){el.innerHTML="Không ghi âm được. "+selfb(i)};r.start()}
function speak(){var l=L[c];return head()+'<h2>Luyện nói</h2><p class="sub">Nghe mẫu, rồi bấm Nói và đọc lại câu.</p>'+l.s.map(function(x,i){var p=x.split("|");return '<div class="card"><div class="hz">'+p[0]+'</div><div class="py">'+tn(p[1])+'</div><p style="margin:8px 0"><button onclick="say(\''+p[0]+'\')">▶ Mẫu</button> <button class="pri" onclick="rec('+i+')">🎤 Nói</button></p><div class="vi" id="r'+i+'" aria-live="polite">'+(ss[i]!=null?"Điểm: "+ss[i]:"")+'</div></div>'}).join("")+'<button class="pri" onclick="fin()">Hoàn thành bài hôm nay</button>'+(msg?'<div class="msg">'+msg+'</div>':'')}
function fin(){var k=Object.keys(ss),sp,sc;if(ls===null||!k.length){msg="Hãy làm xong phần Nghe và nói ít nhất một câu trước.";render();return}
sp=Math.round(k.reduce(function(a,b){return a+ss[b]},0)/k.length);sc=Math.round((ls+sp)/2);
if(S.done.indexOf(c)<0){S.done.push(c);L[c].w.concat(L[c].s).forEach(function(x){var h=x.split("|")[0];S.cards[h]={b:0,d:day()+1}})}
S.log.push({d:new Date().toISOString().slice(0,10),n:c+1,sc:sc,l:ls,s:sp});sv();
msg="Điểm hôm nay: <b>"+sc+"/100</b> (Nghe "+ls+", Nói "+sp+"). "+(sc<60?"Bài sau sẽ đơn giản hơn và ôn lại từ cơ bản.":sc<80?"Giữ nguyên mức này, thêm bài tập thực hành.":sc<90?"Bài sau tăng độ khó phần nghe.":"Rất tốt! Bài sau sẽ khó hơn.")+(c+1<L.length?" Ngày mai làm Bài "+(c+2)+" và ôn từ hôm nay.":" Bạn đã xong 4 bài hiện có. Hãy gửi Bản ghi tiến độ (tab Tiến độ) cho Claude trong chat để tạo thêm bài mới.");
if(c+1<L.length){c=c+1;ls=null;lp=false;ss={}}render()}
function buildQ(){var t=day();rq=Object.keys(S.cards).filter(function(h){return S.cards[h].d<=t});shown=false}
function review(){if(!Object.keys(S.cards).length)return '<h1>Ôn tập</h1><p class="sub">Chưa có từ để ôn. Hoàn thành một bài để bắt đầu. Lịch ôn: sau 1, 3, 7, 14, 30 ngày.</p>';
if(!rq.length)return '<h1>Ôn tập</h1><div class="msg">Hôm nay đã ôn xong. Hẹn bạn lần sau!</div>';
var h=rq[0],d=D[h];return '<h1>Ôn tập</h1><p class="sub">Còn '+rq.length+' mục. Nhớ nghĩa trước, rồi mới hiện đáp án.</p><div class="card" style="text-align:center"><div class="hz big">'+h+'</div><p><button class="sp" aria-label="Nghe" onclick="say(\''+h+'\')">▶</button></p>'+(shown?'<div class="py">'+tn(d.py)+'</div><div class="vi">'+d.vi+'</div>':'')+'</div>'+(shown?'<div class="row"><button class="pri" style="flex:1" onclick="rate(1)">Nhớ</button><button style="flex:1" onclick="rate(0)">Quên</button></div>':'<button class="pri" style="width:100%" onclick="shown=true;render()">Hiện đáp án</button>')}
function rate(ok){var h=rq.shift(),k=S.cards[h];if(ok){k.b=Math.min(k.b+1,5);k.d=day()+I[Math.min(k.b,4)];delete S.weak[h]}else{k.b=0;k.d=day();S.weak[h]=1;rq.push(h)}shown=false;sv();render()}
function rec2(){var m=0,w=Object.keys(S.weak),n=S.log.length,a=function(f){return n?Math.round(S.log.reduce(function(x,y){return x+y[f]},0)/n):0};
for(var h in S.cards)if(S.cards[h].b>=4)m++;
var st=S.done.length<30?1:S.done.length<60?2:3;
return "Ngày "+(S.done.length+1)+" | Giai đoạn "+st+" | Bài đã xong: "+S.done.length+" | Từ đã thuộc: "+m+" | Từ cần ôn: "+(w.length?w.map(function(h){return h+" "+D[h].py}).join(", "):"không")+" | Điểm TB: "+a("sc")+" (Nghe "+a("l")+", Nói "+a("s")+") | Điểm gần nhất: "+(n?S.log[n-1].sc:"chưa có")}
function prog(){var n=S.log.length,w=Object.keys(S.weak),m=0;for(var h in S.cards)if(S.cards[h].b>=4)m++;
return '<h1>Tiến độ</h1><div class="stat"><div class="card"><b>'+(S.done.length+1)+'/90</b>Ngày</div><div class="card"><b>'+S.done.length+'</b>Bài đã xong</div><div class="card"><b>'+m+'</b>Từ đã thuộc</div><div class="card"><b>'+w.length+'</b>Từ cần ôn</div></div>'+
'<h3>Từ cần ôn thêm</h3><p>'+(w.length?w.map(function(h){return '<span class="hz" style="font-size:1.2rem">'+h+'</span> <span class="vi">'+D[h].vi+'</span>'}).join(" &nbsp; "):'Chưa có.')+'</p><h3>Điểm các ngày</h3>'+(n?S.log.slice(-7).map(function(x){return '<div class="card">'+x.d+': Bài '+x.n+' – <b>'+x.sc+'</b> (Nghe '+x.l+', Nói '+x.s+')</div>'}).join(""):'<p class="sub">Chưa có.</p>')+
'<h3>Bản ghi tiến độ cho Claude</h3><textarea id="rec" readonly>'+rec2()+'</textarea><p><button class="pri" onclick="cp()">Sao chép bản ghi</button></p><div id="cpm" class="vi"></div><p class="sub">Dán bản ghi vào chat với Claude để tạo bài mới và ôn đúng chỗ yếu. Dữ liệu lưu trong trình duyệt này.</p>'}
function cp(){var t=document.getElementById("rec");t.select();try{navigator.clipboard.writeText(t.value).then(function(){document.getElementById("cpm").textContent="Đã sao chép."},function(){document.getElementById("cpm").textContent="Hãy giữ và sao chép thủ công."})}catch(e){document.getElementById("cpm").textContent="Hãy giữ và sao chép thủ công."}}
function render(){nav();$(tab=="learn"?learn():tab=="listen"?listen():tab=="speak"?speak():tab=="review"?review():prog())}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
